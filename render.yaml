# Render Blueprint: tells Render how to run the MemoryMate backend.
# In Render: New + -> Blueprint -> pick this GitHub repo. Render reads this file.
# Secrets (DATABASE_URL, GEMINI_API_KEY) are NOT in this file: Render asks for them when you create it.
services:
  - type: web
    name: memorymate
    runtime: python
    plan: free
    region: singapore          # closest Render region to India
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true           # every git push to main redeploys
    envVars:
      - key: DATABASE_URL      # from Neon: Connection string (direct, not "pooled")
        sync: false
      - key: GEMINI_API_KEY    # your own key from https://aistudio.google.com/apikey
        sync: false
      - key: JWT_SECRET        # Render makes a long random one for you
        generateValue: true
      - key: TIMEZONE
        value: Asia/Kolkata
      - key: MISSED_AFTER_MINUTES
        value: "60"

  # The new app design as a website (the Expo app's web version). Free static sites don't sleep.
  # Render builds it from the mobile/ folder on every push and serves the files from dist/.
  - type: web
    name: memorymate-web
    runtime: static
    rootDir: mobile
    buildCommand: npm ci && npx expo export --platform web
    staticPublishPath: ./dist
    envVars:
      - key: EXPO_PUBLIC_SERVER_URL      # the website talks to the backend above
        value: https://memorymate-grie.onrender.com
      - key: NODE_VERSION
        value: "22"
    routes:
      - type: rewrite                     # one-page app: every path shows index.html
        source: /*
        destination: /index.html
